name: Online server

# The online multiplayer server (online/): compile it, run its tests, and audit
# what it installs — whenever it, the game's side of its protocol, or the game
# data it has to know about changes, and once a week so that an advisory
# published against a dependency is noticed without anyone pushing anything.
#
# It deploys nothing. Deploying is done by hand (online/docs/OPERATIONS.md).
on:
  push:
    paths:
      - "online/**"
      - "src/scripts/engine/net/**"
      - "src/scripts/engine/ChunkData.js"
      - "data/blocks/**"
      - "data/biomes/**"
      - "data/terrain/**"
      - ".github/workflows/online.yml"
  pull_request:
    paths:
      - "online/**"
      - "src/scripts/engine/net/**"
      - "src/scripts/engine/ChunkData.js"
      - "data/blocks/**"
      - "data/biomes/**"
      - "data/terrain/**"
      - ".github/workflows/online.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: online
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: online/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Boots the real server and connects real clients — the game's own
      # transport code among them (it is read from ../src).
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Production dependencies only. Fails on anything of moderate severity or
      # above; online/docs/SECURITY.md (Dependencies) says what is known and why
      # it is accepted.
      - name: Audit
        run: npm audit --omit=dev --audit-level=moderate
